version: "3.8"

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostGIS + pgvector database
  # ─────────────────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: reality_ai_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reality_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-reality_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # FastAPI backend (auto-migrates then starts Uvicorn via entrypoint.sh)
  # ─────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reality_ai_api
    restart: on-failure
    # DATABASE_URL points to 'db' hostname inside the Docker network (not localhost)
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-reality_ai}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-reality-ai-surat-2026}
      PLACEHOLDER_MODE: ${PLACEHOLDER_MODE:-true}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reality_ai}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Source mount for hot-reload in dev (remove for a clean prod build)
    volumes:
      - .:/app

  # ─────────────────────────────────────────────────────────────────────────
  # pgAdmin 4 — optional web UI for inspecting the DB
  # Access at http://localhost:5050 | login: admin@reality.ai / admin
  # Comment out this block if you don't need it
  # ─────────────────────────────────────────────────────────────────────────
  db_admin:
    image: dpage/pgadmin4:latest
    container_name: reality_ai_pgadmin
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@reality.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
